[package]
name = "mide"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gpui = "0.2.2"
mide-core = { version = "0.3.0", path = "../core" }
mide-files = { version = "0.3.0", path = "../files" }
mide-fuzzy = { version = "0.3.0", path = "../fuzzy" }
mide-git = { version = "0.3.0", path = "../git" }
mide-lsp = { version = "0.3.0", path = "../lsp" }
mide-syntax = { version = "0.3.0", path = "../syntax" }
mide-term = { version = "0.3.0", path = "../term" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
