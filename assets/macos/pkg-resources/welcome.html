<h2>mide</h2>
<p>A native, fast code editor for macOS, written in Rust. Sublime-style speed, with git history and terminal sessions in the same window.</p>
<p>This installs <b>mide.app</b> in your Applications folder and a <code>mide</code> command in <code>/usr/local/bin</code>.</p>
